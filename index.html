<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Coach Vision</title>

<!-- PWA Meta Tags -->
<meta name="application-name" content="Coach Vision"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="CoachVision"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#00e5a0"/>
<meta name="description" content="Assistant tactique football IA — Séances, analyses, compositions"/>

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json"/>

<!-- Apple Touch Icons -->
<link rel="apple-touch-icon" href="icons/icon-152.png"/>
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png"/>
<link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png"/>

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0d14;--bg2:#0f1320;--bg3:#151b2e;
  --surf:#1a2235;--surf2:#1f2940;
  --bord:#2a3550;--bord2:#354060;
  --acc:#00e5a0;--acc2:#00c488;--acc-d:rgba(0,229,160,.12);--acc-d2:rgba(0,229,160,.05);
  --gold:#f5c842;--gold-d:rgba(245,200,66,.12);
  --red:#ff4d6d;--red-d:rgba(255,77,109,.12);
  --blue:#4d9fff;--blue-d:rgba(77,159,255,.12);
  --purple:#a78bfa;--purple-d:rgba(167,139,250,.12);
  --orange:#f97316;--orange-d:rgba(249,115,22,.12);
  --txt:#e8edf5;--txt2:#8b96b0;--txt3:#5a6480;
  --fd:"Syne",sans-serif;--fb:"DM Sans",sans-serif;
  --r:12px;--rs:8px;--sh:0 4px 24px rgba(0,0,0,.4);
}
body{background:var(--bg);color:var(--txt);font-family:var(--fb);min-height:100vh;min-height:100dvh}
/* Safe area for mobile notch/home bar */
.topbar{padding-top:max(11px, env(safe-area-inset-top, 11px))!important}
.sidebar{padding-top:env(safe-area-inset-top, 0)}
.mob-nav{padding-bottom:max(5px, env(safe-area-inset-bottom, 5px))!important}
.main{padding-bottom:calc(60px + env(safe-area-inset-bottom, 0))}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:224px;min-width:224px;background:var(--bg2);border-right:1px solid var(--bord);display:flex;flex-direction:column;overflow-y:auto;transition:transform .3s ease;z-index:50}
.logo{padding:16px;border-bottom:1px solid var(--bord);display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;background:var(--acc);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-name{font-family:var(--fd);font-size:15px;font-weight:800;line-height:1.1}
.logo-sub{font-size:9px;color:var(--txt3);letter-spacing:.08em;text-transform:uppercase}
.nav-sec{padding:10px 10px 2px}
.nav-lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);font-weight:600;padding:0 8px;margin-bottom:3px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--rs);cursor:pointer;color:var(--txt2);font-size:13px;font-weight:500;transition:all .2s;margin-bottom:1px;position:relative;user-select:none}
.nav-item:hover{background:var(--surf);color:var(--txt)}
.nav-item.active{background:var(--acc-d);color:var(--acc)}
.nav-item.active::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:3px;background:var(--acc);border-radius:0 3px 3px 0}
.nav-ico{width:15px;height:15px;flex-shrink:0}
.sidebar-foot{margin-top:auto;padding:10px;border-top:1px solid var(--bord)}
.user-card{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--rs);background:var(--surf)}
.avatar-sm{width:30px;height:30px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:11px;font-weight:800;color:var(--bg);flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{padding:11px 18px;border-bottom:1px solid var(--bord);background:var(--bg2);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:8px}
.topbar-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.topbar-title{font-family:var(--fd);font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-sub{font-size:11px;color:var(--txt3);white-space:nowrap}
.hamburger{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rs);padding:7px;cursor:pointer;display:none;flex-shrink:0;align-items:center;justify-content:center}
.content{flex:1;overflow-y:auto;padding:18px}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;backdrop-filter:blur(3px)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--rs);font-family:var(--fb);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .2s;white-space:nowrap}
.btn-p{background:var(--acc);color:var(--bg)}.btn-p:hover{background:var(--acc2);box-shadow:0 0 18px rgba(0,229,160,.25)}
.btn-s{background:var(--surf2);color:var(--txt);border:1px solid var(--bord2)}.btn-s:hover{background:var(--surf)}
.btn-g{background:transparent;color:var(--txt2);border:1px solid var(--bord)}.btn-g:hover{background:var(--surf);color:var(--txt)}
.btn-d{background:var(--red-d);color:var(--red);border:1px solid rgba(255,77,109,.2)}
.btn-sm{padding:5px 10px;font-size:12px}.btn-xs{padding:3px 7px;font-size:11px}
.btn-ico{padding:6px;border-radius:var(--rs);background:var(--surf);color:var(--txt2);cursor:pointer;border:1px solid var(--bord);display:inline-flex;transition:all .2s;flex-shrink:0}
.btn-ico:hover{background:var(--surf2);color:var(--txt)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surf);border:1px solid var(--bord);border-radius:var(--r);padding:15px}
.card-h{transition:all .2s;cursor:pointer}.card-h:hover{border-color:var(--bord2);transform:translateY(-1px);box-shadow:var(--sh)}
.card-acc{border-color:rgba(0,229,160,.22);background:var(--acc-d2)}
.card-gold{border-color:rgba(245,200,66,.2);background:rgba(245,200,66,.04)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:11px}
.stat{background:var(--surf);border:1px solid var(--bord);border-radius:var(--r);padding:13px 15px;display:flex;align-items:center;gap:11px}
.stat-ico{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-n{font-family:var(--fd);font-size:22px;font-weight:800;line-height:1}
.stat-l{font-size:11px;color:var(--txt3);margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.t-g{background:var(--acc-d);color:var(--acc)}.t-go{background:var(--gold-d);color:var(--gold)}
.t-r{background:var(--red-d);color:var(--red)}.t-b{background:var(--blue-d);color:var(--blue)}
.t-gr{background:var(--surf2);color:var(--txt2)}.t-p{background:var(--purple-d);color:var(--purple)}
.t-o{background:var(--orange-d);color:var(--orange)}
.fg{margin-bottom:11px}
.fl{display:block;font-size:11px;font-weight:700;color:var(--txt2);margin-bottom:4px;letter-spacing:.04em;text-transform:uppercase}
.fi{width:100%;background:var(--bg2);border:1px solid var(--bord);border-radius:var(--rs);padding:8px 12px;color:var(--txt);font-family:var(--fb);font-size:13px;outline:none;transition:border-color .2s}
.fi:focus{border-color:var(--acc)}
.fs{width:100%;background:var(--bg2);border:1px solid var(--bord);border-radius:var(--rs);padding:8px 12px;color:var(--txt);font-family:var(--fb);font-size:13px;outline:none;cursor:pointer;appearance:none}
.fs:focus{border-color:var(--acc)}
.fta{width:100%;background:var(--bg2);border:1px solid var(--bord);border-radius:var(--rs);padding:8px 12px;color:var(--txt);font-family:var(--fb);font-size:13px;outline:none;resize:vertical;min-height:72px}
.fta:focus{border-color:var(--acc)}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:var(--bord2);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--acc);cursor:pointer}
.rating-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rating-lbl{font-size:12px;color:var(--txt2);width:130px;flex-shrink:0}
.rating-bar{flex:1;height:5px;background:var(--bord2);border-radius:3px;overflow:hidden}
.rating-fill{height:100%;border-radius:3px;transition:width .4s}
.rating-num{font-size:12px;font-weight:800;min-width:20px;text-align:right;font-family:var(--fd)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(5px)}
.modal{background:var(--bg2);border:1px solid var(--bord);border-radius:16px;width:95%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.modal-lg{max-width:700px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:15px 19px;border-bottom:1px solid var(--bord);position:sticky;top:0;background:var(--bg2);z-index:1}
.mt{font-family:var(--fd);font-size:15px;font-weight:700}
.mb{padding:19px}
.mf{padding:11px 19px;border-top:1px solid var(--bord);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--bg2)}
.pitch-wrap{position:relative;border-radius:var(--r);overflow:hidden;border:2px solid var(--bord)}
.pitch-svg{width:100%;display:block;user-select:none}
.ai-panel{background:var(--surf);border:1px solid var(--bord);border-radius:var(--r);display:flex;flex-direction:column}
.ai-msgs{overflow-y:auto;padding:11px;display:flex;flex-direction:column;gap:8px}
.ai-msg{display:flex;gap:7px}.ai-msg.user{flex-direction:row-reverse}
.ai-bub{max-width:84%;padding:8px 12px;border-radius:10px;font-size:12px;line-height:1.55;white-space:pre-wrap}
.ai-msg.ai .ai-bub{background:var(--bg2);color:var(--txt);border-bottom-left-radius:3px}
.ai-msg.user .ai-bub{background:var(--acc);color:var(--bg);font-weight:500;border-bottom-right-radius:3px}
.ai-ir{padding:8px;border-top:1px solid var(--bord);display:flex;gap:6px}
.ai-in{flex:1;background:var(--bg2);border:1px solid var(--bord);border-radius:var(--rs);padding:8px 11px;color:var(--txt);font-family:var(--fb);font-size:12px;outline:none}
.ai-in:focus{border-color:var(--acc)}
.divider{height:1px;background:var(--bord);margin:14px 0}
/* ── Résultats IA formatés ── */
.ai-result-body{display:flex;flex-direction:column;gap:6px;padding:4px 0}
.ai-section-title{font-family:var(--fd);font-size:14px;font-weight:800;color:var(--acc);padding:10px 0 4px;border-bottom:1px solid var(--acc);margin-top:6px;letter-spacing:.02em}
.ai-sub-title{font-family:var(--fd);font-size:13px;font-weight:700;color:var(--txt);padding:6px 0 2px;margin-top:4px}
.ai-p{font-size:13px;color:var(--txt2);line-height:1.65;margin:0}
.ai-p strong,.ai-list strong,.ai-numbered strong,.ai-highlight strong{color:var(--txt);font-weight:700}
.ai-list{margin:2px 0 2px 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.ai-list li{font-size:13px;color:var(--txt2);line-height:1.6;padding:5px 10px 5px 28px;position:relative;background:var(--bg2);border-radius:8px}
.ai-list li::before{content:'▸';position:absolute;left:10px;color:var(--acc);font-size:11px;top:6px}
.ai-numbered{display:flex;align-items:flex-start;gap:10px;padding:5px 0;font-size:13px;color:var(--txt2);line-height:1.6}
.ai-num{min-width:22px;height:22px;background:var(--acc);color:var(--bg);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;margin-top:1px}
.ai-highlight{font-size:13px;color:var(--txt);line-height:1.6;padding:8px 12px;background:var(--bg2);border-left:3px solid var(--acc);border-radius:0 8px 8px 0;margin:2px 0}
.ai-sep{border:none;border-top:1px solid var(--bord);margin:6px 0}
.ai-result-wrap{background:var(--bg2);border-radius:12px;padding:14px 16px;border:1px solid var(--bord);margin-top:8px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;gap:10px;text-align:center}
.empty-ico{width:54px;height:54px;border-radius:14px;background:var(--surf);border:1px solid var(--bord);display:flex;align-items:center;justify-content:center}
.sec-title{font-family:var(--fd);font-size:13px;font-weight:700;margin-bottom:10px}
.pb{height:4px;background:var(--surf2);border-radius:2px;overflow:hidden;margin-top:3px}
.pbf{height:100%;background:var(--acc);border-radius:2px;transition:width .4s}
.tabs{display:flex;gap:2px;background:var(--bg2);border-radius:var(--rs);padding:3px;border:1px solid var(--bord);flex-wrap:wrap;margin-bottom:15px}
.tab{padding:5px 11px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;color:var(--txt3);white-space:nowrap}
.tab.active{background:var(--surf);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.spin{animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fd .22s ease}
@keyframes fd{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bord2);border-radius:2px}
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--bord);padding:5px 2px;z-index:60}
.mob-nav-inner{display:flex}
.mob-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 1px;border-radius:var(--rs);cursor:pointer;color:var(--txt3);font-size:9px;font-weight:600;transition:all .2s;text-align:center}
.mob-item.active{color:var(--acc)}
.mob-item svg{width:18px;height:18px}
.tac-card{background:var(--surf);border:1px solid var(--bord);border-radius:var(--r);padding:13px;cursor:pointer;transition:all .2s}
.tac-card:hover{border-color:var(--acc);background:var(--acc-d2)}
@media(max-width:768px){
  .sidebar{position:fixed;top:0;left:0;bottom:0;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.open{display:block}
  .hamburger{display:flex}
  .content{padding:12px}
  .g2{grid-template-columns:1fr}
  .g3,.g4{grid-template-columns:1fr 1fr}
  .mob-nav{display:block}
  .main{padding-bottom:60px}
  .topbar{padding:9px 12px}
}
@media(max-width:400px){.g3,.g4{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar-overlay" id="sb-ov" onclick="closeSB()"></div>
  <div class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#0a0d14"><circle cx="12" cy="12" r="9"/><polygon points="12,4 14,9 20,9 15,13 17,19 12,15 7,19 9,13 4,9 10,9" fill="#0a0d14" opacity=".88"/></svg>
      </div>
      <div><div class="logo-name">Coach Vision</div><div class="logo-sub">AI Football</div></div>
    </div>
    <div id="sb-nav"></div>
    <div class="sidebar-foot">
      <div class="user-card">
        <div class="avatar-sm">CV</div>
        <div><div style="font-size:12px;font-weight:600">Entraîneur</div><div style="font-size:10px;color:var(--txt3)">Coach Vision Pro</div></div>
      </div>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="hamburger btn-ico" onclick="toggleSB()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div><div class="topbar-title" id="pg-title">Tableau de bord</div><div class="topbar-sub" id="pg-sub">Coach Vision</div></div>
      </div>
      <span class="tag t-g" style="font-size:10px;flex-shrink:0">
        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>IA Active
      </span>
    </div>
    <div class="content" id="content"></div>
  </div>
  <div class="mob-nav"><div class="mob-nav-inner" id="mob-nav"></div></div>
</div>
<div class="overlay" id="mod-ov" style="display:none" onclick="closeMod()">
  <div id="mod-box" onclick="event.stopPropagation()"></div>
</div>
<div class="overlay" id="assign-ov" style="display:none" onclick="closeAssign()">
  <div class="modal" onclick="event.stopPropagation()" style="max-width:410px">
    <div class="mh"><span class="mt" id="assign-title">Assigner</span><button class="btn-ico" onclick="closeAssign()">&#x2715;</button></div>
    <div class="mb" id="assign-body"></div>
  </div>
</div>
<script>

// ═══ STATE ════════════════════════════════════════════════════
const S={
  page:'dashboard',
  players:JSON.parse(localStorage.getItem('cv_players')||'[]'),
  sessions:JSON.parse(localStorage.getItem('cv_sessions')||'[]'),
  exercises:JSON.parse(localStorage.getItem('cv_exercises')||JSON.stringify([
    {id:1,name:"Rondo 5v2",objective:"Possession",players:7,duration:12,description:"Carré 10x10m. 5 joueurs conservent contre 2 défenseurs. Objectif : 8 passes consécutives.",goalkeeper:false},
    {id:2,name:"Pressing collectif 4v4+GK",objective:"Pressing",players:9,duration:15,description:"Demi-terrain. Équipe qui perd le ballon doit presser en moins de 5 secondes.",goalkeeper:true},
    {id:3,name:"Finition sur centre",objective:"Finition",players:8,duration:12,description:"Centres depuis les côtés. Travail du timing de course et de la frappe.",goalkeeper:true},
    {id:4,name:"Transition 3v3+Jokers",objective:"Transition",players:8,duration:15,description:"Deux petites cages. Jokers avec l'équipe en possession.",goalkeeper:false},
    {id:5,name:"Conservation sous pression",objective:"Conservation",players:10,duration:10,description:"Zone 20x20m. 1 point toutes les 10 passes. Haute intensité.",goalkeeper:false},
    {id:6,name:"Bloc défensif 6v6",objective:"Défense",players:12,duration:18,description:"Travail du bloc médian 4-2. Réorganisation rapide après perte.",goalkeeper:false},
  ])),
  opponents:JSON.parse(localStorage.getItem('cv_opponents')||'[]'),
  reports:JSON.parse(localStorage.getItem('cv_reports')||'[]'),
  tac:Object.assign({myF:'4-3-3',oppF:'4-4-2',myAssign:{},myStr:'',myWk:'',oppStr:'',oppWk:'',analysis:'',tab:'setup',subs:[]},JSON.parse(localStorage.getItem('cv_tac')||'{}')),
  _libFilter:'Tous',_aiMsgs:[],_compAvail:null,
};
function save(){['players','sessions','exercises','opponents','reports'].forEach(k=>localStorage.setItem('cv_'+k,JSON.stringify(S[k])));localStorage.setItem('cv_tac',JSON.stringify(S.tac));}

// ═══ FORMATIONS ═══════════════════════════════════════════════

// ═══ FORMAT RÉSULTATS IA ══════════════════════════════════════
function mdInline(t){
  // **gras** → <strong>
  t = t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  // *italique* → <em> (uniquement si pas déjà traité)
  t = t.replace(/(?<!\*)\*(?!\*)([^*]+?)(?<!\*)\*(?!\*)/g,'<em>$1</em>');
  // _souligné_ → <em>
  t = t.replace(/_(.*?)_/g,'<em>$1</em>');
  return t;
}

function formatAI(text){
  if(!text) return '';
  const lines = text.split('\n');
  let html = '';
  let inList = false;

  for(let raw of lines){
    const line = raw.trim();
    if(!line){ if(inList){html+='</ul>';inList=false;} continue; }

    // Séparateur ---
    if(/^---+$/.test(line)){
      if(inList){html+='</ul>';inList=false;}
      html+=`<hr class="ai-sep">`;
    }
    // Titre ## ou ###
    else if(/^#{1,3}\s+/.test(line)){
      if(inList){html+='</ul>';inList=false;}
      const t = mdInline(line.replace(/^#{1,3}\s+/,'').replace(/:$/,''));
      const isMain = /^#{1,2}\s/.test(line);
      html+=`<div class="${isMain?'ai-section-title':'ai-sub-title'}">${t}</div>`;
    }
    // Ligne entièrement en gras **TITRE** = titre de section
    else if(/^\*\*[^*]+\*\*:?\s*$/.test(line)){
      if(inList){html+='</ul>';inList=false;}
      const t = line.replace(/\*\*/g,'').replace(/:$/,'');
      html+=`<div class="ai-sub-title">${t}</div>`;
    }
    // Numérotation 1. 2. etc (titre de section)
    else if(/^\d+[\.\)]\s+[A-ZÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÐÑÒÓÔÕÖÙÚÛÜ]/.test(line)){
      if(inList){html+='</ul>';inList=false;}
      const num = line.match(/^(\d+)/)[1];
      const t = mdInline(line.replace(/^\d+[\.\)]\s+/,'').replace(/:$/,''));
      html+=`<div class="ai-section-title" style="font-size:13px"><span class="ai-num" style="display:inline-flex;margin-right:8px">${num}</span>${t}</div>`;
    }
    // Bullet - ou • ou ▸ ou →
    else if(/^[-•▸→✓✗]\s+/.test(line)){
      if(!inList){html+='<ul class="ai-list">';inList=true;}
      const t = mdInline(line.replace(/^[-•▸→✓✗]\s+/,''));
      html+=`<li>${t}</li>`;
    }
    // Numérotation simple 1. texte minuscule = liste numérotée
    else if(/^\d+[\.\)]\s+/.test(line)){
      if(inList){html+='</ul>';inList=false;}
      const num = line.match(/^(\d+)/)[1];
      const t = mdInline(line.replace(/^\d+[\.\)]\s+/,''));
      html+=`<div class="ai-numbered"><span class="ai-num">${num}</span><span>${t}</span></div>`;
    }
    // Emoji en début = point mis en avant
    else if(/^\p{Emoji}/u.test(line)){
      if(inList){html+='</ul>';inList=false;}
      html+=`<div class="ai-highlight">${mdInline(line)}</div>`;
    }
    // **Label:** contenu = ligne avec label gras
    else if(/^\*\*[^*]+\*\*\s*:/.test(line)){
      if(inList){html+='</ul>';inList=false;}
      html+=`<p class="ai-p">${mdInline(line)}</p>`;
    }
    // Texte normal
    else {
      if(inList){html+='</ul>';inList=false;}
      html+=`<p class="ai-p">${mdInline(line)}</p>`;
    }
  }
  if(inList) html+='</ul>';
  return `<div class="ai-result-body">${html}</div>`;
}

function saveGroqKey(){
  const key = document.getElementById('groq-key-input').value.trim();
  if(!key.startsWith('gsk_')){ showToast('Clé invalide (doit commencer par gsk_)', '#ff4d6d'); return; }
  localStorage.setItem('groq_api_key', key);
  document.getElementById('groq-setup-modal')?.remove();
  showToast('Clé enregistrée ! ✓', '#00e5a0');
}

async function callAI(sys, usr, maxTok=1400){
  const key = getGroqKey();
  if(!key){ showGroqSetup(); throw new Error('NO_KEY'); }

  let r;
  try {
    r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + key,
      },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        max_tokens: maxTok,
        messages: [
          { role: 'system', content: sys },
          { role: 'user', content: usr }
        ]
      })
    });
  } catch(err) {
    showToast('Erreur réseau. Vérifie ta connexion internet.', '#ff4d6d');
    throw new Error('NETWORK_ERROR');
  }
  if(!r.ok){
    const e = await r.json().catch(()=>({}));
    const msg = e?.error?.message || 'Erreur ' + r.status;
    if(r.status === 401){ localStorage.removeItem('groq_api_key'); showGroqSetup(); }
    showToast('Erreur IA : ' + msg, '#ff4d6d');
    throw new Error(msg);
  }
  const d = await r.json();
  return d.choices?.[0]?.message?.content || '';
}

function showToast(msg, color='#00e5a0'){
  // Remove existing toast
  document.querySelectorAll('.cv-toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'cv-toast';
  t.style.cssText = `position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:${color};color:${color==='#00e5a0'?'#000':'#fff'};padding:10px 18px;border-radius:20px;font-size:13px;font-weight:700;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.5);animation:fd .3s ease;max-width:90vw;text-align:center;white-space:nowrap`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function initials(n){return(n||'').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();}
function pCol(pos){return PC[pos]||'#00e5a0';}
function skColor(v){return v>=8?'#00e5a0':v>=6?'#f5c842':v>=4?'#f97316':'#ff4d6d';}
function ovRating(p){const sk=getSkills(p.position);const vals=sk.map(s=>p.skills?.[s.key]||0).filter(v=>v>0);return vals.length?Math.round(vals.reduce((a,b)=>a+b)/vals.length*10)/10:0;}
function portrait(p,sz=44){const col=pCol(p.position);return `<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${col}22;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:${Math.floor(sz*.32)}px;font-weight:800;color:${col};flex-shrink:0">${initials(p.name)}</div>`;}
function rBar(label,val,col){return `<div class="rating-row"><div class="rating-lbl">${label}</div><div class="rating-bar"><div class="rating-fill" style="width:${val*10}%;background:${col||skColor(val)}"></div></div><div class="rating-num" style="color:${skColor(val)}">${val}</div></div>`;}
function pitchSVG(fk,assign={},color='#00e5a0',inter=false,pid='p1'){
  const W=400,H=560,pos=(FORM[fk]||FORM['4-3-3']);
  const px=p=>(p/100)*W,py=p=>(p/100)*H;
  const nodes=pos.map((p,i)=>{
    const pl=assign[p.id]?S.players.find(x=>x.id===assign[p.id]):null;
    const col=i===0?'#f5c842':color,lbl=pl?initials(pl.name):(i+1)+'',has=!!pl;
    const ring=has?`<circle cx="${px(p.x)}" cy="${py(p.y)}" r="21" fill="none" stroke="${col}" stroke-width="1.5" opacity=".45"/>`:
      (inter?`<circle cx="${px(p.x)}" cy="${py(p.y)}" r="20" fill="${col}0a" stroke="${col}44" stroke-width="1.5" stroke-dasharray="3 2"/>`:'');
    const nm=pl?`<text x="${px(p.x)}" y="${py(p.y)+28}" text-anchor="middle" fill="white" font-size="8" font-weight="600" font-family="DM Sans,sans-serif" paint-order="stroke" stroke="rgba(0,0,0,.8)" stroke-width="2.5">${pl.name.split(' ')[0]}</text>`:
      `<text x="${px(p.x)}" y="${py(p.y)+25}" text-anchor="middle" fill="rgba(255,255,255,.4)" font-size="8" font-family="DM Sans,sans-serif">${p.label}</text>`;
    const clk=inter?`onclick="openAssign('${p.id}','${p.label}','${fk}')" style="cursor:pointer"`:'' ;
    return `<g ${clk}>${ring}<circle cx="${px(p.x)}" cy="${py(p.y)}" r="17" fill="${col}${has?'':'77'}" stroke="rgba(255,255,255,${has?.9:.4})" stroke-width="2"/><text x="${px(p.x)}" y="${py(p.y)+1}" text-anchor="middle" dominant-baseline="middle" fill="#000" font-size="${lbl.length>2?7:9}" font-weight="800" font-family="Syne,sans-serif">${lbl}</text>${nm}</g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="pitch-svg" id="${pid}" xmlns="http://www.w3.org/2000/svg">
  <defs><pattern id="gr${pid}" patternUnits="userSpaceOnUse" width="44" height="44"><rect width="44" height="44" fill="#1a6b3a"/><rect width="44" height="22" fill="#1d7340"/></pattern></defs>
  <rect width="${W}" height="${H}" fill="url(#gr${pid})"/>
  <g stroke="rgba(255,255,255,.58)" stroke-width="1.5" fill="none">
    <rect x="18" y="16" width="${W-36}" height="${H-32}" rx="2"/>
    <line x1="18" y1="${H/2}" x2="${W-18}" y2="${H/2}"/>
    <circle cx="${W/2}" cy="${H/2}" r="44"/>
    <circle cx="${W/2}" cy="${H/2}" r="3" fill="rgba(255,255,255,.58)"/>
    <rect x="102" y="16" width="196" height="64"/><rect x="142" y="16" width="116" height="26"/>
    <rect x="102" y="${H-80}" width="196" height="64"/><rect x="142" y="${H-42}" width="116" height="26"/>
    <rect x="158" y="6" width="84" height="12" stroke-width="2"/>
    <rect x="158" y="${H-18}" width="84" height="12" stroke-width="2"/>
  </g>
  <circle cx="${W/2}" cy="${H/2-1}" r="7" fill="white" stroke="#ccc" stroke-width="1"/>
  ${nodes.join('')}
  <text x="${W/2}" y="${H-4}" text-anchor="middle" fill="rgba(255,255,255,.32)" font-size="11" font-family="Syne,sans-serif" font-weight="700">${fk}</text>
</svg>`;
}

function openAssign(posId,posLbl,fk){
  S._at={posId,fk};
  const pos=(FORM[fk]||[]).find(p=>p.id===posId);
  document.getElementById('assign-title').textContent=`${posLbl} – ${pos?.role||''}`;
  const COMPAT={'Gardien':['Gardien'],'Défenseur Central':['Défenseur Central'],'Arrière Gauche':['Arrière Gauche','Défenseur Central'],'Arrière Droit':['Arrière Droit','Défenseur Central'],'Piston Gauche':['Piston Gauche','Arrière Gauche','Milieu Central'],'Piston Droit':['Piston Droit','Arrière Droit','Milieu Central'],'Milieu Défensif':['Milieu Défensif','Milieu Central'],'Milieu Central':['Milieu Central','Milieu Défensif','Milieu Offensif'],'Milieu Gauche':['Milieu Gauche','Milieu Central'],'Milieu Droit':['Milieu Droit','Milieu Central'],'Milieu Offensif':['Milieu Offensif','Milieu Central','Ailier Gauche','Ailier Droit'],'Ailier Gauche':['Ailier Gauche','Milieu Offensif'],'Ailier Droit':['Ailier Droit','Milieu Offensif'],'Avant-Centre':['Avant-Centre','Ailier Gauche','Ailier Droit']};
  const compat=COMPAT[pos?.role||'']||POSITIONS;
  const rec=S.players.filter(p=>compat.includes(p.position));
  const oth=S.players.filter(p=>!compat.includes(p.position));
  const body=document.getElementById('assign-body');
  if(!S.players.length){body.innerHTML=`<div class="empty" style="padding:24px"><p style="color:var(--txt3);font-size:13px">Aucun joueur.</p><button class="btn btn-p" style="margin-top:10px" onclick="closeAssign();nav('players')">${ic('plus')} Créer</button></div>`;document.getElementById('assign-ov').style.display='flex';return;}
  const cur=S.tac.myAssign[posId];
  const card=p=>{
    const a=S.tac.myAssign[posId]===p.id;
    const el=Object.values(S.tac.myAssign).includes(p.id)&&!a;
    const ov=ovRating(p);
    return `<div onclick="doAssign('${p.id}')" style="display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--rs);border:1.5px solid ${a?'var(--acc)':'var(--bord)'};background:${a?'var(--acc-d)':'var(--bg2)'};cursor:pointer;margin-bottom:5px;transition:all .2s;opacity:${el?.5:1}">
      ${portrait(p,34)}
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:700;font-family:var(--fd)">${p.name}${p.number?` <span style="color:var(--txt3);font-size:10px">#${p.number}</span>`:''}</div>
        <div style="font-size:10px;color:var(--txt3)">${p.position}${ov>0?` · <span style="color:${skColor(ov)}">${ov}/10</span>`:''}</div>
        ${p.strengths?.length?`<div style="font-size:10px;color:var(--acc)">✦ ${p.strengths.slice(0,2).join(' · ')}</div>`:''}
      </div>
      ${a?`<span style="color:var(--acc)">${ic('check')}</span>`:''}${el?`<span style="font-size:9px;color:var(--txt3)">Placé</span>`:''}
    </div>`;
  };
  body.innerHTML=(rec.length?`<div style="font-size:10px;color:var(--txt3);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Recommandés</div>${rec.map(card).join('')}`:'')
    +(oth.length?`<div style="font-size:10px;color:var(--txt3);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:10px 0 6px">Autres</div>${oth.map(card).join('')}`:'')
    +(cur?`<div style="margin-top:10px"><button class="btn btn-d btn-sm" onclick="doAssign(null)" style="width:100%;justify-content:center">${ic('x')} Retirer</button></div>`:'');
  document.getElementById('assign-ov').style.display='flex';
}
function doAssign(pid){
  if(pid)S.tac.myAssign[S._at?.posId]=pid;else delete S.tac.myAssign[S._at?.posId];
  closeAssign();
  if(S.page==='tactical')pgTactical();else if(S.page==='composition')pgComp();
}
function closeAssign(){document.getElementById('assign-ov').style.display='none';}

async function sendAI(){
  const inp=document.getElementById('ai-in');
  if(!inp||!inp.value.trim())return;
  const msg=inp.value.trim();inp.value='';
  S._aiMsgs.push({r:'u',c:msg});
  addAI('user',msg);
  const t=addAI('ai','<span class="spin">⏳</span>');
  try{
    const res=await callAI('Tu es Coach Vision, assistant de coaching football professionnel UEFA Pro. Réponds en français, de manière pédagogique et structurée.',msg);
    const b=t.querySelector('.ai-bub');if(b)b.textContent=res;
    S._aiMsgs.push({r:'a',c:res});
  }catch(e){const b=t.querySelector('.ai-bub');if(b)b.textContent='Erreur de connexion.';}
}
function addAI(role,content){
  const msgs=document.getElementById('ai-msgs');

  const d=document.createElement('div');d.className='ai-msg '+(role==='user'?'user':'ai');
  d.innerHTML=`<div style="width:25px;height:25px;border-radius:50%;background:${role==='user'?'var(--surf2)':'var(--acc)'};display:flex;align-items:center;justify-content:center;flex-shrink:0">${role==='user'?ic('user',11):ic('zap',11)}</div><div class="ai-bub">${content}</div>`;

}

async function genSuggestions(){

async function analyzePlayer(id){
  const p=S.players.find(x=>x.id===id);if(!p)return;
  const btn=document.getElementById('pa-btn');if(btn){btn.disabled=true;btn.innerHTML=`<span class="spin">⏳</span>`;}
  const skTxt=SKILLS.filter(sk=>p.skills?.[sk.key]).map(sk=>`${sk.label}:${p.skills[sk.key]}/10`).join(', ');
  try{
    const res=await callAI(
      'Tu es un recruteur et analyste football professionnel. Réponds en français. Structure ta réponse avec des titres ## et des listes avec tirets -. Pas de texte avec des astérisques isolés.',
      `Analyse ce profil joueur.\nNom: ${p.name} | Poste: ${p.position} | Pied: ${p.foot||'Droit'} | Âge: ${p.age||'?'} ans\nAttributs techniques: ${skTxt||'Non renseignés'}\nPoints forts déclarés: ${p.strengths?.join(', ')||'N/A'}\nAxes de progression: ${p.weaknesses?.join(', ')||'N/A'}\n\n## PROFIL\nRédige 2 phrases décrivant ce joueur.\n\n## POSTE IDÉAL\nIndique son poste idéal et 1-2 postes alternatifs avec justification courte.\n\n## POINTS FORTS\nListe 3-4 points forts avec tirets -\n\n## AXES PRIORITAIRES\nListe 3 axes de progression avec tirets -\n\n## EXERCICES RECOMMANDÉS\nPropose 3 exercices spécifiques avec tirets -\n\n## POTENTIEL 12 MOIS\nÉvaluation du potentiel de progression en 2 phrases.`);
    const el=document.getElementById('pa-res');if(el)el.innerHTML=`<div class="ai-result-wrap">${formatAI(res)}</div>`;
  }catch(e){const el=document.getElementById('pa-res');if(el)el.textContent='Erreur de connexion.';}
  if(btn){btn.disabled=false;btn.innerHTML=ic('refresh',12)+' Ré-analyser';}
}

function updateFormSkills(pos){
  const isGK=pos==='Gardien';

  // Sauvegarde les valeurs actuelles avant de changer
  const oldVals={};[...SKILLS,...GK_SKILLS].forEach(sk=>{const el=document.getElementById('sk-'+sk.key);if(el)oldVals[sk.key]=el.value;});
  if(skillsTitle)skillsTitle.textContent=isGK?'⛳ Attributs Gardien — noter sur 10':'⚽ Attributs — noter sur 10';
  skillsList.innerHTML=getSkills(pos).map(sk=>{
    const val=oldVals[sk.key]||5;

  }).join('');
}

function savePlayer(editId){

  [...SKILLS,...GK_SKILLS].forEach(sk=>{const v=document.getElementById('sk-'+sk.key);if(v)skills[sk.key]=parseInt(v.value);});

async function generateSess(){
  const btn=document.getElementById('gen-btn');if(btn){btn.disabled=true;btn.innerHTML=`<span class="spin">⏳</span>`;}
  const cat=document.getElementById('sf-cat').value,lvl=document.getElementById('sf-lvl').value,pl=document.getElementById('sf-pl').value,dur=document.getElementById('sf-dur').value,obj=document.getElementById('sf-obj').value,ctx=document.getElementById('sf-ctx')?.value;
  try{
    const res=await callAI('Tu es un entraîneur UEFA Pro. Réponds en français.',
      `Génère une séance d'entraînement football.\nCatégorie:${cat}|Niveau:${lvl}|Joueurs:${pl}|Durée:${dur}min|Objectif:${obj}${ctx?'|Contexte:'+ctx:''}\n\nFormat STRICT:\nTITRE: [titre]\n\nÉCHAUFFEMENT (15 min):\nNom: []\nDescription: []\nObjectif: []\n\nATELIER 1 (20 min):\nNom: []\nDescription: []\nObjectif: []\nGardien: oui/non\n\nATELIER 2 (20 min):\nNom: []\nDescription: []\nObjectif: []\nGardien: oui/non\n\nATELIER BONUS (15 min):\nNom: []\nDescription: []\nObjectif: []\n\nJEU RÉDUIT (${parseInt(dur)-70} min):\nNom: []\nDescription: []\nFormat: []\n\nCONSEILS: [3 conseils coach]`);
    const lines=res.split('\n'),get=p=>lines.find(l=>l.startsWith(p))?.replace(p,'').trim()||'';
    const phases=['ÉCHAUFFEMENT','ATELIER 1','ATELIER 2','ATELIER BONUS','JEU RÉDUIT'];
    const pC={'ÉCHAUFFEMENT':'#f5c842','ATELIER 1':'#00e5a0','ATELIER 2':'#00e5a0','ATELIER BONUS':'#4d9fff','JEU RÉDUIT':'#ff4d6d'};
    const pD={'ÉCHAUFFEMENT':15,'ATELIER 1':20,'ATELIER 2':20,'ATELIER BONUS':15,'JEU RÉDUIT':Math.max(15,parseInt(dur)-70)};
    const exs=[];let cur=null;
    for(const line of lines){const ph=phases.find(p=>line.startsWith(p));if(ph){if(cur)exs.push(cur);const dm=line.match(/\((\d+)/);cur={id:Date.now()+Math.random(),phase:ph,color:pC[ph],duration:dm?parseInt(dm[1]):pD[ph],name:'',description:'',objective:'',goalkeeper:false};}else if(cur){if(line.startsWith('Nom:'))cur.name=line.slice(4).trim();if(line.startsWith('Description:'))cur.description=line.slice(12).trim();if(line.startsWith('Objectif:'))cur.objective=line.slice(9).trim();if(line.startsWith('Gardien:'))cur.goalkeeper=line.toLowerCase().includes('oui');}}
    if(cur)exs.push(cur);
    const s={id:String(Date.now()),name:get('TITRE:')||`Séance ${obj}`,date:new Date().toISOString().split('T')[0],category:cat,level:lvl,duration:parseInt(dur),objective:obj,players:parseInt(pl),exercises:exs.filter(e=>e.name),coachNotes:get('CONSEILS:'),generated:true};
    S.sessions.push(s);save();closeMod();viewSess(s.id);
  }catch(e){if(btn){btn.disabled=false;btn.innerHTML=ic('zap')+' Réessayer';}}
}

function parseAnalysis(text){
  if(!text) return '';
  // Split by numbered sections (1. 2. 3. etc)
  const sectionColors=['#00e5a0','#4d9fff','#f97316','#ff4d6d','#f5c842','#a78bfa'];
  const sectionIcons=['target','shield','zap','activity','star','bulb'];
  const lines=text.split('\n');
  let html='';
  let currentSection=null;
  let currentContent=[];
  let sectionIdx=0;

  const flushSection=()=>{
    if(!currentSection) return;
    const col=sectionColors[sectionIdx%sectionColors.length];
    const ico_name=sectionIcons[sectionIdx%sectionIcons.length];
    const bodyText=currentContent.join('\n').trim();
    // Parse bullet points inside section
    const bodyHtml=bodyText.split('\n').map(line=>{
      const trimmed=line.trim();
      if(!trimmed) return '';
      if(trimmed.match(/^[-•·▸→]/)){
        return `<div style="display:flex;gap:7px;margin-bottom:5px;padding:5px 8px;background:var(--bg2);border-radius:6px;border-left:2px solid ${col}"><span style="color:${col};flex-shrink:0;margin-top:1px">▸</span><span style="font-size:12px;color:var(--txt2);line-height:1.5">${trimmed.replace(/^[-•·▸→]\s*/,'')}</span></div>`;
      }
      return `<p style="font-size:12px;color:var(--txt2);line-height:1.6;margin-bottom:4px">${trimmed}</p>`;
    }).join('');
    html+=`<div style="background:var(--surf);border:1px solid var(--bord);border-radius:var(--r);padding:14px;margin-bottom:10px;border-left:3px solid ${col}">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:10px">
        <div style="width:26px;height:26px;border-radius:7px;background:${col}22;display:flex;align-items:center;justify-content:center">${ic(ico_name,13).replace('currentColor',col)}</div>
        <div style="font-family:var(--fd);font-size:13px;font-weight:700;color:${col}">${currentSection}</div>
      </div>
      <div>${bodyHtml}</div>
    </div>`;
    sectionIdx++;
    currentSection=null;
    currentContent=[];
  };

  for(const line of lines){
    const m=line.match(/^(\d+\.\s+|[A-ZÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏ][A-ZÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÐÑÒÓÔÕÖÙÚÛÜÝÞ\s']{3,}[:：]?$)/);
    if(m||(line.match(/^\d+\./) && line.length<80)){
      flushSection();
      currentSection=line.replace(/^\d+\.\s*/,'').replace(/:$/,'').trim();
    } else if(currentSection){
      currentContent.push(line);
    } else if(line.trim()){
      currentContent.push(line);
      if(!currentSection) currentSection='Analyse';
    }
  }
  flushSection();
  // If nothing was parsed with sections, just render as card
  if(!html && text.trim()){
    html=`<div class="card">${formatAI(text)}</div>`;
  }
  return html;
}

function toggleSub(pid){
  if(!S.tac.subs) S.tac.subs=[];
  const idx=S.tac.subs.indexOf(pid);
  if(idx>=0) S.tac.subs.splice(idx,1);
  else if(S.tac.subs.length<7) S.tac.subs.push(pid);
  save();
  tacTab('pitch');
}

async function runAna(){

  T.myStr=gv('my-s')||T.myStr;T.myWk=gv('my-w')||T.myWk;T.oppStr=gv('opp-s')||T.oppStr;T.oppWk=gv('opp-w')||T.oppWk;

  const btn=document.getElementById('ana-btn')||document.getElementById('ana-btn2');
  if(btn){btn.disabled=true;btn.innerHTML=`<span class="spin">⏳</span> Analyse...`;}
  const pos=FORM[T.myF]||[];
  const cLines=pos.map(p=>{const pid=T.myAssign[p.id];const pl=pid?S.players.find(x=>x.id===pid):null;return pl?`  ${p.role}: ${pl.name}${pl.strengths?.length?' ('+pl.strengths.slice(0,2).join(', ')+')':''}`:null;}).filter(Boolean).join('\n');

  const playerDetails=pos.map(p=>{const pid=T.myAssign[p.id];const pl=pid?S.players.find(x=>x.id===pid):null;if(!pl) return null;const ov=ovRating(pl);const topSkills=SKILLS.filter(sk=>(pl.skills?.[sk.key]||0)>=7).slice(0,3).map(sk=>sk.label);return `  ${p.role} – ${pl.name} (note:${ov}/10${topSkills.length?', forces: '+topSkills.join(', '):''}${pl.weaknesses?.length?', axe: '+pl.weaknesses.slice(0,1).join(''):''})`; }).filter(Boolean).join('\n');
  const subPlayers=(T.subs||[]).map(pid=>{const pl=S.players.find(p=>p.id===pid);if(!pl)return null;const ov=ovRating(pl);const topSk=SKILLS.filter(sk=>(pl.skills?.[sk.key]||0)>=7).slice(0,2).map(sk=>sk.label);return `  ${pl.position} – ${pl.name}${ov>0?' (note:'+ov+'/10)':''}${topSk.length?', forces: '+topSk.join(', '):''}`;}).filter(Boolean).join('\n');
  try{

      `## CONTEXTE\nMon équipe: ${T.myF} | Forces: ${T.myStr||'N/A'} | Faiblesses: ${T.myWk||'N/A'}\nAdversaire: ${T.oppF} | Forces: ${T.oppStr||'N/A'} | Faiblesses: ${T.oppWk||'N/A'}\n${playerDetails?'\n## COMPOSITION TITULAIRE\n'+playerDetails:cLines?'\n## COMPOSITION\n'+cLines:''}\n${subPlayers?'\n## REMPLAÇANTS DISPONIBLES\n'+subPlayers:''}\n\nFournis l\'analyse suivante:\n\n## 1. DUEL DE SYSTÈMES\nAvantages et risques du ${T.myF} face au ${T.oppF}\n\n## 2. ZONES D'AVANTAGE\nOù dominer sur le terrain\n\n## 3. PLAN OFFENSIF\n3 stratégies d'attaque concrètes\n\n## 4. PLAN DÉFENSIF\nComment neutraliser l'adversaire\n\n## 5. CLÉS DU MATCH\nPoints décisifs à surveiller\n\n## 6. RECOMMANDATION COACH\nConseil prioritaire${subPlayers?'\n\n## 7. GESTION DES REMPLAÇANTS\nQuand et comment utiliser les remplaçants disponibles':''}`
    );
    T.tab='analysis';pgTactical();
  }catch(e){
    if(btn){btn.disabled=false;btn.innerHTML=ic('zap')+' Analyser';}
    if(!['NO_KEY','CLE_INVALIDE','NETWORK_ERROR','CORS_ERROR'].includes(e.message)) showToast('Erreur IA : '+e.message,'#ff4d6d');

async function genPM(){
  const oppSel=document.getElementById('pm-opp').value;
  const oppObj=oppSel&&oppSel!=='custom'?S.opponents.find(o=>o.id===oppSel):null;
  const oppName=oppObj?.name||document.getElementById('pm-on')?.value||'Adversaire';
  const oppForm=oppObj?.formation||document.getElementById('pm-of')?.value||'4-4-2';
  const oppInfo=oppObj?(oppObj.strengths?.join(', ')||'')+' | '+(oppObj.weaknesses?.join(', ')||''):document.getElementById('pm-oi')?.value||'';
  const myForm=document.getElementById('pm-mf')?.value||'4-3-3';
  const ctx=document.getElementById('pm-ctx')?.value||'';
  const avail=S.players.filter(p=>document.getElementById('pm-p-'+p.id)?.checked);
  const btn=document.getElementById('pm-btn');if(btn){btn.disabled=true;btn.innerHTML=`<span class="spin">⏳</span>`;}
  const pList=avail.slice(0,15).map(p=>`${p.name}(${p.position}${ovRating(p)?','+ovRating(p):''}/10)`).join(', ');
  try{
    const res=await callAI('Tu es un coach UEFA Pro. Génère une analyse d\'avant-match complète et professionnelle en français.',
      `Avant-match:\nMON ÉQUIPE: ${myForm}${pList?' | Joueurs: '+pList:''}\nADVERSAIRE: ${oppName} en ${oppForm}${oppInfo?' | '+oppInfo:''}\n${ctx?'CONTEXTE: '+ctx:''}\n\n1. RÉSUMÉ ADVERSAIRE (3-4 phrases)\n2. POINTS FORTS ADVERSES (3-4 éléments)\n3. FAIBLESSES À EXPLOITER (3-4 zones)\n4. PLAN DE JEU (offensif + défensif)\n5. COMPOSITION SUGGÉRÉE pour ${myForm}\n6. CONSIGNES D'AVANT-MATCH (5-6 points)\n7. CLÉS DU MATCH (2-3 éléments décisifs)`);
    const el=document.getElementById('pm-res');
    if(el)el.innerHTML=`<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:11px"><div style="font-family:var(--fd);font-size:14px;font-weight:700">${ic('zap',13)} vs ${oppName}</div><span class="tag t-g" style="font-size:9px">IA</span></div>${formatAI(res)}</div>`;
  }catch(e){
    if(!['NO_KEY','CLE_INVALIDE','NETWORK_ERROR','CORS_ERROR'].includes(e.message)) showToast('Erreur IA : '+e.message,'#ff4d6d');

  if(btn){btn.disabled=false;btn.innerHTML=ic('zap')+' Régénérer';}
}

// ═══ PWA INSTALL PROMPT ═══════════════════════════════════════
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  // Show install button in topbar
  setTimeout(()=>{
    const btn = document.createElement('button');
    btn.id = 'pwa-install-btn';
    btn.style.cssText = 'background:var(--acc);color:#000;border:none;border-radius:var(--rs);padding:5px 10px;cursor:pointer;font-size:11px;font-weight:700;font-family:var(--fb);display:flex;align-items:center;gap:4px;flex-shrink:0;animation:fd .3s ease';
    btn.innerHTML = '📲 Installer';
    btn.onclick = installPWA;
    const topbar = document.querySelector('.topbar > div:last-child');
    if(topbar) topbar.insertBefore(btn, topbar.firstChild);
  }, 2000);
});

async function installPWA(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  const {outcome} = await deferredInstallPrompt.userChoice;
  if(outcome==='accepted'){
    showToast('Coach Vision installé ! ✓','#00e5a0');
    document.getElementById('pwa-install-btn')?.remove();
  }
  deferredInstallPrompt = null;
}

window.addEventListener('appinstalled', ()=>{
  showToast('Coach Vision est installé sur votre téléphone ✓','#00e5a0');
  deferredInstallPrompt = null;
  document.getElementById('pwa-install-btn')?.remove();
});
